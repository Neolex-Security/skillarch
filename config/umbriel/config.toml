# SkillArch Umbriel config — dual-session with Hyprland (greetd / Noctalia Greeter).
# Hyprland stays the default Wayland session; pick "Umbriel" at the greeter to try this.
#
# Docs: https://docs.noctalia.dev/umbriel/
# Noctalia integration: https://docs.noctalia.dev/noctalia/compositor-settings/umbriel/
#
# Defining [keybinds] replaces Umbriel's built-in set — keep this table complete.
# Validate: umbriel validate
# Outputs:  umbriel outputs

[include.optional]
# Both entries resolved to the same path → "include cycle or duplicate skipped".
files = ["~/.config/umbriel/noctalia.toml", "~/.config/umbriel/hdmi-on.toml", "noctalia.toml"]

[general]
autostart = ["noctalia","zen-browser","thunderbird","obsidian"]
# Super on DRM / native session; Alt when nested inside another compositor.
mod_key = "Super"

# Samsung Odyssey G9 (LC49G95T): prefer DisplayPort, disable HDMI duplicate.
# Omit mode → preferred advertised mode. Pin with e.g. mode = "5120x1440@120" after
# `umbriel outputs` if the wrong mode is selected.
# Re-run `umbriel outputs` if connector names differ on another machine.
[output.DP-1]
position = [0, 0]
scale = 1.25
mode = "5120x1440@120"
# Vertical workspace axis → horizontal scrolling strip (best for ultrawide).
workspace_axis = "horizontal"
# Static 20 workspaces. min_workspaces (dynamic) kept the last workspace empty,
# which slid any window placed on the last one back by one. Static lets a window
# live on workspace 20.
workspaces = 20

# [output.HDMI-A-1] lives in ~/.config/umbriel/hdmi-on.toml so monitor-input can
# flip it without dirtying the repo. Main-config values win over includes, so the
# key cannot stay here.

# Laptop panel: same static 20 workspaces (no wildcard output section, so set per connector).
[output.eDP-1]
workspaces = 20

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[input.keyboard]
# Kanata remaps the physical AZERTY board to US positions — match Hyprland.
layout = "fr"
numlock_toggle = true

# Ultrawide-friendly default scrolling strip; dwindle/master available per workspace.
[layout]
gap = 5
extent_presets = [0.333, 0.5, 0.667]
mode = "dwindle"

[layout.scrolling]
default_extent_fraction = 0.5

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

# ── Keybinds (aligned with SkillArch Hyprland + Noctalia where possible) ──
[keybinds]

# Applications (names mirror config/hypr/settings/*)
"Mod+Return" = { action = "spawn:kitty", repeat = false }
"Mod+B" = { action = "spawn:zen-browser", repeat = false }
"Mod+E" = { action = "spawn:thunar", repeat = false }
"Mod+Shift+E" = { action = "spawn:emote", repeat = false }
"Mod+Shift+C" = { action = "spawn:gnome-calculator", repeat = false }
"XF86Calculator" = { action = "spawn:gnome-calculator", repeat = false }

# Noctalia shell (same as Hyprland noctalia_shell.lua)
"Mod+Space" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+Shift+Return" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+S" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Alt+Tab" = { action = "spawn:noctalia msg window-switcher", repeat = false }
"Mod+asterisk" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Shift+A" = { action = "spawn:noctalia msg screenshot-annotate", repeat = false }
"Mod+Ctrl+A" = { action = "spawn:noctalia msg annotate", repeat = false }

"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMute" = "spawn:noctalia msg volume-mute"
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"
"XF86AudioPlay" = "spawn:playerctl play-pause"
"XF86AudioPause" = "spawn:playerctl pause"
"XF86AudioNext" = "spawn:playerctl next"
"XF86AudioPrev" = "spawn:playerctl previous"
"XF86AudioMicMute" = "spawn:pactl set-source-mute @DEFAULT_SOURCE@ toggle"

# Focus / move (scrolling: left/right = columns)
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "window-focus-up"
"Mod+J" = "window-focus-down"
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"

# DDC/CI: the G9 only answers DDC on the HDMI bus (/dev/i2c-2), never on DP-1,
# so Noctalia's own brightness backend has no display to bind. Script drives
# ddcutil on bus 2 and raises Noctalia's OSD.
"Mod+F9" = { action = "spawn:/opt/skillarch/config/bin/ddc-brightness down 10", repeat = true }
"Mod+F10" = { action = "spawn:/opt/skillarch/config/bin/ddc-brightness up 10", repeat = true }
# Flips the G9 between DP and HDMI over DDC. Enables [output.HDMI-A-1] on the
# way out so the panel keeps a signal and stays reachable for the way back;
# with the KVM on the Mac the return is the joystick, then `monitor-input dp`.
"Mod+F11" = { action = "spawn:/opt/skillarch/config/bin/monitor-input toggle", repeat = false }
"Mod+F12" =  { action = "spawn:voxtype record toggle", repeat = false }
# Window state
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
# Mod+R enters the resize submap (see [keybinds] resize section below).
# Mod+Shift+R keeps the quick extent-cycle for when you don't want the submap.
"Mod+R" = { action = "submap:resize", repeat = false }
"Mod+Shift+R" = "window-cycle-primary-extent-back"
# consume (Mod+Comma is Noctalia settings)
"Mod+Period" = "window-consume-right"
"Mod+Shift+Period" = "window-consume-left"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Scratchpad (Hyprland uses Mod+Z on special:magic)
"Mod+Z" = "scratchpad-toggle:music"
"Mod+Shift+Z" = { action = "window-move-to-scratchpad:music", repeat = false }
"Mod+Ctrl+Z" = { action = "window-restore-from-scratchpad:music", repeat = false }
"Mod+Ctrl+Tab" = "scratchpad-focus-next:music"

# Session / misc
"Mod+Shift+K" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+Q" = { action = "spawn:bash /opt/skillarch/config/hypr/scripts/wlogout.sh", repeat = false }
"Mod+Shift+L" = { action = "spawn:bash /opt/skillarch/config/hypr/scripts/power.sh lock", repeat = false }
"Mod+Shift+S" = { action = "spawn:/opt/skillarch/config/bin/switch-audio-output", repeat = false }
"Mod+W" = { action = "spawn:/opt/skillarch/config/bin/set-default-browser", repeat = false }
"Mod+Ctrl+W" = { action = "spawn:waypaper --random", repeat = false }
"Mod+Shift+W" = { action = "spawn:waypaper", repeat = false }
"Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }

"Mod+A" = { action = "spawn:noctalia msg panel-toggle alexander/mimir:chat", repeat = false }
# Workspaces — AZERTY fr top row: unshifted emits the symbol, Shift emits the digit
# (same convention as config/hypr/lua/keybindings.lua). Umbriel matches the keysym
# produced by the active layout, so both forms are bound: symbols for fr, digits
# for a us layout. Kanata only remaps the letter rows, not the number row.
"Mod+ampersand" = "workspace-switch:1"
"Mod+1" = "workspace-switch:1"
"Mod+eacute" = "workspace-switch:2"
"Mod+2" = "workspace-switch:2"
"Mod+quotedbl" = "workspace-switch:3"
"Mod+3" = "workspace-switch:3"
"Mod+apostrophe" = "workspace-switch:4"
"Mod+4" = "workspace-switch:4"
"Mod+parenleft" = "workspace-switch:5"
"Mod+5" = "workspace-switch:5"
"Mod+minus" = "workspace-switch:6"
"Mod+6" = "workspace-switch:6"
"Mod+egrave" = "workspace-switch:7"
"Mod+7" = "workspace-switch:7"
"Mod+underscore" = "workspace-switch:8"
"Mod+8" = "workspace-switch:8"
"Mod+ccedilla" = "workspace-switch:9"
"Mod+9" = "workspace-switch:9"
"Mod+agrave" = "workspace-switch:10"
"Mod+0" = "workspace-switch:10"

"Mod+Shift+ampersand" = "window-move-to-workspace:1"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+eacute" = "window-move-to-workspace:2"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+quotedbl" = "window-move-to-workspace:3"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+apostrophe" = "window-move-to-workspace:4"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+parenleft" = "window-move-to-workspace:5"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+minus" = "window-move-to-workspace:6"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+egrave" = "window-move-to-workspace:7"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+underscore" = "window-move-to-workspace:8"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+ccedilla" = "window-move-to-workspace:9"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Shift+agrave" = "window-move-to-workspace:10"
"Mod+Shift+0" = "window-move-to-workspace:10"

# Second decade (11-20): same top-row keys + Ctrl.
"Mod+Ctrl+ampersand" = "workspace-switch:11"
"Mod+Ctrl+1" = "workspace-switch:11"
"Mod+Ctrl+eacute" = "workspace-switch:12"
"Mod+Ctrl+2" = "workspace-switch:12"
"Mod+Ctrl+quotedbl" = "workspace-switch:13"
"Mod+Ctrl+3" = "workspace-switch:13"
"Mod+Ctrl+apostrophe" = "workspace-switch:14"
"Mod+Ctrl+4" = "workspace-switch:14"
"Mod+Ctrl+parenleft" = "workspace-switch:15"
"Mod+Ctrl+5" = "workspace-switch:15"
"Mod+Ctrl+minus" = "workspace-switch:16"
"Mod+Ctrl+6" = "workspace-switch:16"
"Mod+Ctrl+egrave" = "workspace-switch:17"
"Mod+Ctrl+7" = "workspace-switch:17"
"Mod+Ctrl+underscore" = "workspace-switch:18"
"Mod+Ctrl+8" = "workspace-switch:18"
"Mod+Ctrl+ccedilla" = "workspace-switch:19"
"Mod+Ctrl+9" = "workspace-switch:19"
"Mod+Ctrl+agrave" = "workspace-switch:20"
"Mod+Ctrl+0" = "workspace-switch:20"

"Mod+Ctrl+Shift+ampersand" = "window-move-to-workspace:11"
"Mod+Ctrl+Shift+1" = "window-move-to-workspace:11"
"Mod+Ctrl+Shift+eacute" = "window-move-to-workspace:12"
"Mod+Ctrl+Shift+2" = "window-move-to-workspace:12"
"Mod+Ctrl+Shift+quotedbl" = "window-move-to-workspace:13"
"Mod+Ctrl+Shift+3" = "window-move-to-workspace:13"
"Mod+Ctrl+Shift+apostrophe" = "window-move-to-workspace:14"
"Mod+Ctrl+Shift+4" = "window-move-to-workspace:14"
"Mod+Ctrl+Shift+parenleft" = "window-move-to-workspace:15"
"Mod+Ctrl+Shift+5" = "window-move-to-workspace:15"
"Mod+Ctrl+Shift+minus" = "window-move-to-workspace:16"
"Mod+Ctrl+Shift+6" = "window-move-to-workspace:16"
"Mod+Ctrl+Shift+egrave" = "window-move-to-workspace:17"
"Mod+Ctrl+Shift+7" = "window-move-to-workspace:17"
"Mod+Ctrl+Shift+underscore" = "window-move-to-workspace:18"
"Mod+Ctrl+Shift+8" = "window-move-to-workspace:18"
"Mod+Ctrl+Shift+ccedilla" = "window-move-to-workspace:19"
"Mod+Ctrl+Shift+9" = "window-move-to-workspace:19"
"Mod+Ctrl+Shift+agrave" = "window-move-to-workspace:20"
"Mod+Ctrl+Shift+0" = "window-move-to-workspace:20"

# Layout-proof workspace navigation (vertical axis on DP-1).
"Mod+Ctrl+Down" = "workspace-next"
"Mod+Ctrl+Up" = "workspace-previous"
"Mod+Tab" = "workspace-focus-last"

# ── Resize submap (enter with Mod+R) ──
# Bare keys are grabbed only while the submap is active; they must be scoped with
# the "submap[resize]," key prefix. Arrows or hjkl resize; Escape/Return leave.
# primary extent = width (scrolling axis), secondary extent = height in a column.
"submap[resize],Right" = "window-modify-primary-extent:0.05"
"submap[resize],Left"  = "window-modify-primary-extent:-0.05"
"submap[resize],Down"  = "window-modify-secondary-extent:0.05"
"submap[resize],Up"    = "window-modify-secondary-extent:-0.05"
"submap[resize],l" = "window-modify-primary-extent:0.05"
"submap[resize],h" = "window-modify-primary-extent:-0.05"
"submap[resize],j" = "window-modify-secondary-extent:0.05"
"submap[resize],k" = "window-modify-secondary-extent:-0.05"
"submap[resize],Escape" = "submap:reset"
"submap[resize],Return" = "submap:reset"

[[scratchpad]]
name = "music"


# ── Window / layer rules (Noctalia first-class) ──
[[window_rule]]
blur = true
blur_optimized = true

 [[window_rule]]
 match.app_id = "Spotify"
 default_scratchpad = "music"

[[window_rule]]
match.app_id = "md.obsidian.Obsidian"
default_workspace = 11

[[window_rule]]
match.app_id = "org.mozilla.Thunderbird"
# Integer position scoped to DP-1 by default_output. Unscoped it counts the
# disabled HDMI-A-1's workspace and lands one short; a string is an exact
# workspace-name lookup, which the static inventory does not resolve here.
default_output = "DP-1"
default_workspace = 10

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# wl-mirror paints DP-1 onto the HDMI output so the same session shows on both
# inputs. Its own --fullscreen-output flag is ignored here: umbriel tiles the
# window on the focused output instead, so the placement is pinned by rule.
[[window_rule]]
match.app_id = "^at.yrlf.wl_mirror$"
default_output = "HDMI-A-1"
default_fullscreen = true

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|window-switcher|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[input.focus]
follows_mouse = true

[include]
files = []
